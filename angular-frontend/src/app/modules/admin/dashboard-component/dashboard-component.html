<section class="p-8 max-w-6xl mx-auto">
  
  <div class="mb-8 border-b pb-4 flex justify-between items-start">
    <div>
      <h1 class="text-3xl font-bold mb-2 text-primary">Panel de Administración</h1>
      <p class="text-lg">Bienvenido/a, <span class="font-semibold text-primary-600">{{ store.user()?.email }}</span>.</p>
      <p class="text-gray-600">Roles: {{ store.user()?.roles?.join(', ') }}</p>
    </div>
    
    <button (click)="logout()" class="bg-primary-700 text-white hover:bg-primary-600 px-4 py-2 rounded-md text-sm font-bold transition-colors shadow-sm">
      Cerrar sesión
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <div class="lg:col-span-1 bg-gray-50 p-6 rounded-lg shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold mb-4 text-primary">Crear Usuario</h2>
      
      <form [formGroup]="createForm" (ngSubmit)="onCreateUser()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input type="email" formControlName="email" class="h-10 text-sm w-full border border-slate-300 rounded-md px-3 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none" placeholder="ejemplo@correo.com">
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-1">Contraseña</label>
          <input type="password" formControlName="password" class="h-10 text-sm w-full border border-slate-300 rounded-md px-3 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none" placeholder="Mínimo 6 caracteres">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Nombre (Opcional)</label>
          <input type="text" formControlName="nombre" class="h-10 text-sm w-full border border-slate-300 rounded-md px-3 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none" placeholder="Tu nombre">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Rol</label>
          <select formControlName="roles" class="h-10 text-sm w-full border border-slate-300 rounded-md px-3 bg-white focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none">
            <option value="ROLE_USER">Usuario Normal (ROLE_USER)</option>
            <option value="ROLE_ADMIN">Administrador (ROLE_ADMIN)</option>
          </select>
        </div>

        <button type="submit" [disabled]="createForm.invalid || isSubmitting" class="h-10 w-full bg-primary-600 text-white text-sm font-bold rounded-md hover:bg-primary-700 disabled:opacity-50 transition cursor-pointer">
        {{ isSubmitting ? 'Creando...' : 'Crear Usuario' }}
        </button>
      </form>
    </div>

    <div class="lg:col-span-2 space-y-4">
      
      <div class="flex gap-2">
        <input 
          type="text" 
          [value]="searchQuery" 
          (input)="updateSearchQuery($event)" 
          placeholder="Buscar por email o nombre..." 
          class="h-10 text-sm flex-1 border border-slate-300 rounded-md px-3 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none"
        >
        <button (click)="loadUsers()" class="h-10 text-sm bg-primary-600 text-white px-4 rounded-md hover:bg-primary-700 transition">
          Buscar
        </button>
      </div>

      <div *ngIf="tempPasswordMessage" class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded mb-4">
        <p class="font-bold">¡Atención!</p>
        <p>{{ tempPasswordMessage }}</p>
        <p class="text-sm mt-1">Copia esta contraseña, desaparecerá al recargar la página.</p>
      </div>

      <div *ngIf="users.length > 0" class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
        <table class="w-full text-left border-collapse divide-y divide-slate-200">
          <thead class="bg-slate-50">
            <tr>
              <th class="p-3 text-xs font-bold text-slate-500 uppercase">ID</th>
              <th class="p-3 text-xs font-bold text-slate-500 uppercase">Email / Nombre</th>
              <th class="p-3 text-xs font-bold text-slate-500 uppercase">Roles</th>
              <th class="p-3 text-xs font-bold text-slate-500 uppercase text-right">Acciones</th>
            </tr>
          </thead>
