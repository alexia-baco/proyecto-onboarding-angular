<main class="min-h-screen bg-white">
  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-8 lg:px-16">
    
    <app-back-to-landing-button class="mb-8 block"></app-back-to-landing-button>

    <app-page-title 
      title="Gestión de Tareas" 
      subtitle="Organiza y administra tus tareas pendientes">
    </app-page-title>

    <button class="mt-8 mb-8 w-full sm:w-auto min-h-[44px] rounded-md bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600">
      Crear Tarea
    </button>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 lg:gap-6 mt-6">
      
      <div *ngFor="let task of tasks" class="flex flex-col rounded-lg border border-gray-200 p-6 shadow-sm hover:shadow-md transition-shadow">
        <h3 class="text-lg font-semibold text-gray-900">{{ task.title }}</h3>
        
        <p class="mt-4">
          Estado: 
          <span [class]="task.status === 'completada' ? 'font-medium text-green-600' : task.status === 'en progreso' ? 'font-medium text-blue-600' : 'font-medium text-yellow-600'">
            {{ task.status }}
          </span>
        </p>
        
        @if (task.dueDate) {
          <p class="mt-2 text-sm text-gray-500">
            Fecha límite: {{ task.dueDate }}
          </p>
        }
      </div>

    </div>
  </div>
</main>
