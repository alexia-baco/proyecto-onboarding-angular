<form [formGroup]="form" (ngSubmit)="onSubmit()" class="mb-4">
  <h2 class="text-xl font-bold mb-6 text-primary">Crear nueva tarea</h2>

  <div class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Título</label>
      <input type="text" formControlName="titulo" 
        class="h-10 w-full rounded-md border border-slate-300 px-3 py-2 text-sm transition-shadow focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary" 
        placeholder="Ej: Comprar el pan" />
      
      <p *ngIf="form.get('titulo')?.hasError('required') && form.get('titulo')?.touched" class="text-red-500 text-xs mt-1.5 font-medium">
        El título es obligatorio.
      </p>
      <p *ngIf="form.get('titulo')?.hasError('minlength') && form.get('titulo')?.touched" class="text-red-500 text-xs mt-1.5 font-medium">
        Mínimo 3 caracteres.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
      <textarea formControlName="descripcion" rows="3" 
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm transition-shadow focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary"
        placeholder="Añade más detalles..."></textarea>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Estado</label>
        <select formControlName="estado" 
          class="h-10 w-full rounded-md border border-slate-300 px-3 py-2 text-sm bg-white transition-shadow focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary">
          <option value="pendiente">Pendiente</option>
          <option value="en progreso">En progreso</option>
          <option value="completada">Completada</option>
        </select>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Fecha límite</label>
        <input type="date" formControlName="fechaLimite" 
          class="h-10 w-full rounded-md border border-slate-300 px-3 py-2 text-sm transition-shadow focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
    </div>

    <div class="pt-2">
      <button type="submit" [disabled]="form.invalid" 
        class="h-10 w-full sm:w-auto rounded-md bg-primary-600 px-6 font-bold text-white text-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary disabled:opacity-50 transition-all">
        Guardar Tarea
      </button>
    </div>
  </div>
</form>
