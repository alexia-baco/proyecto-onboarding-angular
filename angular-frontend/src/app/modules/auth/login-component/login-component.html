<form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto mt-12 max-w-md space-y-4">
  <h1 class="text-2xl font-bold text-primary">Iniciar sesión</h1>

  <div>
    <label class="block text-sm font-medium text-slate-700">Email</label>
    <input type="email" formControlName="email" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 h-10 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" />
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-700">Contraseña</label>
    <input type="password" formControlName="password" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 h-10 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" />
  </div>

  <button [disabled]="loading || form.invalid" class="h-10 w-full rounded-md bg-primary-600 px-5 text-sm font-bold text-white hover:bg-primary-700 disabled:opacity-50 transition-colors">
    Entrar
  </button>

  <p class="text-sm text-slate-600 mt-4">
    ¿No tienes cuenta?
    <a routerLink="/register" class="font-semibold text-primary-600 hover:text-primary-700 transition-colors">Crea una aquí</a>.
    <a routerLink="/" class="ml-2 text-slate-600 hover:text-slate-800">Volver al inicio</a>
  </p>
</form>
